[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentcompass"
dynamic = ["version"]
description = "Multi-agent task router and subscription quota scheduler: a small-model classifier profiles each task, and allocation is deterministic for a given profile."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "akiiwa-games" }]
keywords = ["agents", "router", "quota"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
venice = ["openai>=1.0"]
tray = ["psutil", "pystray", "Pillow", "pywin32"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "psutil"]

[project.urls]
Homepage = "https://github.com/akiiwa-games/AgentCompass"
Repository = "https://github.com/akiiwa-games/AgentCompass"
Releases = "https://github.com/akiiwa-games/AgentCompass/releases"

[project.scripts]
agentcompass = "agentcompass.cli:main"

[tool.hatch.version]
path = "agentcompass/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentcompass"]
exclude = ["agentcompass/test_*.py"]

[tool.hatch.build.targets.sdist]
only-include = [
  "agentcompass",
  "packaging/stage_data.py",
  "packaging/hatch_build.py",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "pyproject.toml",
]
exclude = [
  "setup/host_sync",
  "setup/host_sync/out",
  "**/node_modules",
  "**/__pycache__",
  "**/*.pyc",
  "packaging/.staged",
  "packaging/.build",
]

[tool.hatch.build.targets.sdist.force-include]
"packaging/stage_data.py" = "packaging/stage_data.py"
"packaging/hatch_build.py" = "packaging/hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "packaging/hatch_build.py"

[tool.pytest.ini_options]
addopts = "--capture=sys"
testpaths = ["agentcompass", "skills/agent-compass", "setup", "tray", "audit", "skills/chatgpt-pro-consult", "skills/dot-subagent", "usage-float"]
norecursedirs = ["host_sync", "node_modules", ".staged", ".build", "verify-release", ".git", "__pycache__", ".*", "dist", "build", "scratch", "route-agent-work"]
markers = [
  "slow: tests that start real subprocesses, packaging, sandbox checks or real Tk main loops",
]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Real defects only: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
