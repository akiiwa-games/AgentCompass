name: ci

# Machine-run checks so a worker only has to run the tests of the feature it touched.
#   tests: the fast suite (everything not marked `slow`) under the repository's own hermetic run (conftest.py / hermetic_run.py).
#   posix-cli: the built wheel installed into a fresh virtualenv on Linux, the README's macOS / Linux CLI path.
# Packaging, sandbox and tray-installer checks stay in release.yml (tag push).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Install the package with the dev and tray extras
        run: python -m pip install --upgrade pip ".[dev,tray]"
      - name: Run the fast test suite
        run: python -X utf8 -m pytest -n auto -m "not slow"

  posix-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build hatchling
          python -m build --wheel
      - name: Install the wheel into a fresh virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: Offline demo plan
        run: "$RUNNER_TEMP/venv/bin/agentcompass" plan --demo --dry-run
      - name: Doctor
        run: "$RUNNER_TEMP/venv/bin/agentcompass" doctor
