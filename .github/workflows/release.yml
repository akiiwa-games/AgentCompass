name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that references/public-data.json matches the shipped reference data
        run: python -X utf8 skills/agent-compass/scripts/public_data.py manifest --check
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build hatchling
          python -m build
      - name: Check that only tracked files are in the wheel and sdist
        run: python packaging/check_payload.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  # Gate contract: it blocks publishing, and only publishing. Failure it stops: a wheel whose installed commands (collector, router
  # reads, roll/plan, doctor, the documented commands) only work because something else is importable or on the build machine.
  # Decision: the wheel from the job above is installed into a fresh virtualenv with an isolated home and run; provider HTTP goes to a
  # local fixture, nothing leaves the runner. Recovery: fix the cause named in the failed assertion and tag again. A broken
  # sandbox or missing dependency fails the job too (a release is rare; an unchecked wheel costs more than a re-run). The job also
  # builds the PyInstaller tray from an isolated copy and runs its `--run-component` entries against the same fixture; the Inno
  # installer, startup entries and GUI windows are listed as not executed in the report, never as passed.
  sandbox:
    needs: wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install the tray extra and PyInstaller (the tray scenarios and the frozen-tray scenario need both)
        run: python -m pip install --upgrade pip pyinstaller==6.18.0 pillow==12.3.0 psutil==7.2.1 pystray==0.19.5 pywin32==311 tzdata==2026.2 ".[tray]"
      - name: Run the installed wheel through the user operations
        shell: bash
        run: python -X utf8 packaging/sandbox_check.py --wheel dist/*.whl --report sandbox-report
      # Failure: a wheel that installs and passes the operations above but cannot dispatch from zero (no account, discovery, usage, classify,
      # route, ledger, a real worker process, completion back to the parent, recovery from quota/crash/lost delivery). Action blocked: publishing.
      # Decision: assertions over the public entry with fixture providers and hosts; Herdr's real hc runtime is not on the runner and is
      # reported as not executed. Recovery: fix the named assertion and tag again.
      - name: Dispatch from zero through the installed wheel
        shell: bash
        run: python -X utf8 packaging/zero_dispatch_check.py --wheel dist/*.whl --report zero-dispatch-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-report
          path: |
            sandbox-report/*
            zero-dispatch-report/*

  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Install the tray extra and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.18.0 pillow==12.3.0 psutil==7.2.1 pystray==0.19.5 pywin32==311 tzdata==2026.2 ".[tray]"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build the tray installer
        shell: pwsh
        run: ./packaging/build.ps1
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
      - name: Check that the tray bundle and code package hold only tracked repository files
        shell: pwsh
        run: |
          $appZip = @(Get-ChildItem -Path dist/app-*.zip -ErrorAction Stop)[0].FullName
          python packaging/check_payload.py --toc packaging/.build/agentcompass-tray/Analysis-00.toc --app-zip "$appZip"
      - uses: actions/upload-artifact@v4
        with:
          name: tray-installer
          path: |
            dist/AgentCompass-tray-setup.exe
            dist/app-*.zip
            dist/manifest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, tray, sandbox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Read the release subtitle
        id: subtitle
        run: echo "text=$(head -n 1 .github/RELEASE_SUBTITLE)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — ${{ steps.subtitle.outputs.text }}"
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/wheel/*
            artifacts/tray-installer/AgentCompass-tray-setup.exe
            artifacts/tray-installer/app-*.zip
            artifacts/tray-installer/manifest.json
