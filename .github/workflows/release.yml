name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build hatchling
          python -m build
      - name: Check that only tracked files are in the wheel and sdist
        run: python packaging/check_payload.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the tray extra and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller ".[tray]"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build the tray installer
        shell: pwsh
        run: ./packaging/build.ps1
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
      - name: Check that the tray bundle holds only tracked repository files
        run: python packaging/check_payload.py --toc packaging/.build/agentcompass-tray/Analysis-00.toc
      - uses: actions/upload-artifact@v4
        with:
          name: tray-installer
          path: dist/AgentCompass-tray-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, tray]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Read the release subtitle
        id: subtitle
        run: echo "text=$(head -n 1 .github/RELEASE_SUBTITLE)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — ${{ steps.subtitle.outputs.text }}"
          body_path: .github/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/wheel/*
            artifacts/tray-installer/AgentCompass-tray-setup.exe
